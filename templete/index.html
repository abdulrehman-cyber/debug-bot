<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DebugBot - AI Debugging Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar-modern">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="logo-text">
                        <h2>DebugBot</h2>
                        <span>By Abdul Rehman</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="clearHistoryBtn" class="btn-clear">
                    <i class="fas fa-trash-alt"></i> Clear History
                </button>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span>Online</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <!-- Chat Header -->
            <header class="chat-header">
                <div class="header-left">
                    <div class="bot-avatar">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="bot-info">
                        <h3>DebugBot</h3>
                        <p><i class="fas fa-circle"></i> Active now</p>
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-btn" id="refreshBtn" title="Refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="header-btn" id="helpBtn" title="Help">
                        <i class="fas fa-question-circle"></i>
                    </button>
                </div>
            </header>

            <!-- Chat Messages -->
            <div class="chat-messages-modern" id="chatMessages">
                <div class="welcome-message">
                    <div class="welcome-icon">
                        <i class="fas fa-hand-peace"></i>
                    </div>
                    <h2>Assalam-o-Alaikum! 👋</h2>
                    <p>I'm <strong>DebugBot</strong>, your AI debugging assistant.</p>
                    <p>Ask me about Python errors, debugging tips, or coding help!</p>
                    <div class="welcome-tags">
                        <span class="tag"><i class="fas fa-bug"></i> Debugging</span>
                        <span class="tag"><i class="fas fa-code"></i> Python</span>
                        <span class="tag"><i class="fas fa-graduation-cap"></i> Learning</span>
                    </div>
                </div>
            </div>

            <!-- Chat Input -->
            <div class="chat-input-modern">
                <div class="input-container">
                    <div class="input-wrapper-modern">
                        <i class="fas fa-pen input-icon"></i>
                        <input 
                            type="text" 
                            id="userInput" 
                            placeholder="Ask about Python errors or debugging..." 
                            class="input-field"
                            autocomplete="off"
                        >
                        <button id="sendBtn" class="btn-send">
                            <i class="fas fa-paper-plane"></i>
                            <span>Send</span>
                        </button>
                    </div>
                    <div class="input-suggestions">
                        <span class="suggestion" onclick="fillSuggestion('How to fix SyntaxError?')">
                            <i class="fas fa-lightbulb"></i> SyntaxError
                        </span>
                        <span class="suggestion" onclick="fillSuggestion('What is a NameError?')">
                            <i class="fas fa-lightbulb"></i> NameError
                        </span>
                        <span class="suggestion" onclick="fillSuggestion('How to debug Python code?')">
                            <i class="fas fa-lightbulb"></i> Debugging tips
                        </span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Typing Indicator (hidden by default) -->
    <div id="typingIndicator" style="display: none;" class="typing-indicator">
        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <span class="typing-text">DebugBot is thinking...</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
